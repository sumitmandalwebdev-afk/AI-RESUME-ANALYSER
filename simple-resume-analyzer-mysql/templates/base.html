<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ResumeIQ — AI Resume Analyzer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-mark">◆</span> Resume<span class="accent">IQ</span>
      </a>
      <nav class="nav" id="main-nav">
        {% if user %}
          <a href="/dashboard">Dashboard</a>
          <a href="/history">History</a>
          <a href="/admin" id="admin-link" style="display:none">Admin</a>
          <button class="btn btn-ghost" id="logout-btn">Logout</button>
        {% else %}
          <a href="/login" class="btn btn-primary">Login / Signup</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>ResumeIQ — Simple AI Resume Analyzer · Built for learning</p>
    </div>
  </footer>

  <div id="toast-container"></div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
